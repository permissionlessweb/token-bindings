[workspace]
members = ["contracts/*", "packages/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
homepage = "https://junonetwork.io"
repository = "https://github.com/CosmosContracts/token-bindings"
version = "0.11.0"

[workspace.dependencies]
anyhow = "1"
cosmwasm-schema = "3.0.2"
cosmwasm-std = "3.0.2"
cw-multi-test  = "3.0.1"
cw-schema = "3.0.2"
cw-storage-plus = "3.0.1"
cw2 = "3.0.0"
itertools = "0.14.0"
schemars = "0.8.22"
serde = "1.0"
thiserror = "1.0"

token-bindings = { path = "./packages/bindings", version = "0.11.0" }
token-bindings-test = { path = "./packages/bindings-test", version = "0.11.0" }

[profile.release]
codegen-units = 1
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
panic = 'abort'
incremental = false
# Please do not disable these. Doing so will cause overflow checks in
# all workspace members to stop working. Overflows should be errors.
overflow-checks = true
